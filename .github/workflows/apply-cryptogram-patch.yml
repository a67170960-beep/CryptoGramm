name: Apply Cryptogram UI patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply uploaded patch
        run: |
          git apply --index CryptoGramm-ui-and-icon.patch
          git rm CryptoGramm-ui-and-icon.patch

      - name: Commit applied changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Redesign Cryptogram settings and add launcher icon"
          git push origin main
